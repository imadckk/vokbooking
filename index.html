<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Lesson Booking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@latest/dist/basecoat.cdn.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Restore SPA path from 404.html redirect
    (function () {
      var l = window.location;
      if (l.search && l.search.startsWith("?/")) {
        var path = l.search.slice(1).split("&")[0];
        window.history.replaceState(null, "", "/" + path + l.hash);
      }
    })();
    // Light mode only — no system preference detection, no toggle.
  </script>
</head>
<body class="min-h-dvh bg-background text-foreground">
  <div id="app"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
